name: Tests & Validation

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node tools (Prettier)
        run: npm install -g prettier

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Check JSON formatting (Prettier)
        run: make format-check

      - name: Run test suite
        run: pytest tests/ -v

      - name: Test package build and offline validation CLI
        run: |
          pip install build
          python -m build --wheel
          python -m impresso_schemas --contract-version 1 issue examples/canonical_issue/example0.json
          python -m jsonlschema --help
