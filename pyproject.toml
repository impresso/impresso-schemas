[project]
name = "impresso-schemas"
version = "0.1.0"
description = "JSON schemas for the Impresso project"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "smart_open>=6",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "check-jsonschema>=0.26",
]

[project.scripts]
jsonlschema = "jsonlschema:main"
impresso-schemas = "impresso_schemas.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = ["jsonlschema"]
package-dir = {"" = "scripts", "impresso_schemas" = "impresso_schemas"}

[tool.setuptools.packages.find]
include = ["impresso_schemas*"]

[tool.setuptools.package-data]
impresso_schemas = ["json/**/*.json"]

[tool.pytest.ini_options]
markers = [
  "legacy: validates schemas and examples in the stable legacy namespace",
  "imp2: validates schemas and examples in the Impresso 2 namespace",
]
